server.port=${PORT:8080}
# Local secrets (e.g. the Claude API key) live in this git-ignored file
spring.config.import=optional:file:./config/application-local.properties
spring.application.name=banking-application

# ---- Database ----
# Default: a local H2 database file in ./data (no setup). To use Supabase/PostgreSQL, set POSTGRES_URL
# (or DATABASE_URL, or banking.database.url in config/application-local.properties) to the connection string:
#   postgresql://USER:PASSWORD@HOST:PORT/postgres
banking.database.url=${POSTGRES_URL:${DATABASE_URL:}}
# Refuse to start without an external database (set in the Docker image: container files are not kept)
banking.database.require-external=${BANKING_REQUIRE_EXTERNAL_DB:false}
# When the database is empty on first start, data from these CSV files is imported (else sample data is created)
banking.import.csv-dir=${BANKING_IMPORT_CSV_DIR:./data}
spring.sql.init.mode=always

# Signs login tokens. Set the same random value on every server instance (required on Vercel).
banking.session.secret=${BANKING_SESSION_SECRET:}

# Password given to the 10 seeded sample customers
banking.seed.default-password=Password@123

# ---- AI agents (Claude) ----
# Credentials: set ANTHROPIC_API_KEY (or log in with `ant auth login`).
banking.agents.enabled=${BANKING_AGENTS_ENABLED:true}
# Only for API keys not scoped to a workspace (start with sk-ant-usr-): the workspace ID (wrkspc_...) from the Console
banking.agents.workspace-id=${ANTHROPIC_WORKSPACE_ID:}
banking.agents.model=claude-opus-5-5
banking.agents.effort=medium
banking.agents.max-tokens=16000
banking.agents.max-tool-rounds=8
banking.agents.fallbacks=true
# Daily spending cap for all Claude calls (estimated from token counts); resets at midnight in this time zone
banking.agents.daily-budget-usd=${BANKING_AI_DAILY_BUDGET_USD:1.00}
banking.agents.budget-zone=America/New_York
# Per-agent overrides (agent = assistant | support | operations | fraud)
banking.agents.overrides.support.effort=low
# Fraud monitor: which transfers get a model review
banking.agents.fraud.enabled=true
banking.agents.fraud.review-threshold=10000
banking.agents.fraud.velocity-count=3
banking.agents.fraud.review-all=false
